name: juke
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_card_swiper: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_spinkit: ^5.2.2
  go_router: ^17.4.0
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  qr: ^3.0.2
  spotify_sdk: ^3.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
  fonts:
    - family: Anton
      fonts:
        - asset: fonts/Anton-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-VariableFont_wght.ttf
