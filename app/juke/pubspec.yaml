name: juke
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_card_swiper: ^7.2.0
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_spinkit: ^5.2.2
  go_router: ^17.4.0
  # Pinned to the fork behind juliansteenbakker/mobile_scanner#1779 so the
  # camera is actually released on web. Go back to the pub.dev release once
  # that PR is merged and published.
  mobile_scanner:
    git:
      url: https://github.com/apptreesoftware/mobile_scanner.git
      ref: 5c4704f416f82e69db668ea5523e9f38e6f76220
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  qr: ^3.0.2
  spotify_sdk: ^4.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
  fonts:
    - family: Anton
      fonts:
        - asset: fonts/Anton-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-VariableFont_wght.ttf
